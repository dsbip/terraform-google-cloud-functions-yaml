# Deploys tests/integration into a real project, checks that a second plan is
# empty, updates in place, and destroys everything again. Runs only on demand.
#
# Setup (repository settings > Secrets and variables > Actions > Variables):
#   CF_YAML_TEST_PROJECT            project to test in (Cloud Functions, Cloud
#                                   Build, Cloud Run, Artifact Registry, Eventarc,
#                                   Pub/Sub and Cloud Storage APIs enabled)
#   GCP_WORKLOAD_IDENTITY_PROVIDER  projects/NUMBER/locations/global/workloadIdentityPools/POOL/providers/PROVIDER
#   GCP_SERVICE_ACCOUNT             service account with roles/cloudfunctions.admin,
#                                   roles/run.admin, roles/storage.admin,
#                                   roles/pubsub.admin and roles/iam.serviceAccountUser
name: Live test

on:
  workflow_dispatch:
    inputs:
      region:
        description: Region to deploy to
        default: europe-west1

permissions:
  contents: read
  id-token: write

jobs:
  live:
    runs-on: ubuntu-latest
    if: vars.CF_YAML_TEST_PROJECT != ''
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r tests/python/requirements.txt
      - run: python -m pytest tests/python/test_live.py -v
        env:
          CF_YAML_TEST_PROJECT: ${{ vars.CF_YAML_TEST_PROJECT }}
          CF_YAML_TEST_REGION: ${{ inputs.region }}
          CF_YAML_TEST_MEMBER: serviceAccount:${{ vars.GCP_SERVICE_ACCOUNT }}
