# yaml-language-server: $schema=../../schemas/cloud-functions-config.schema.json
#
# HTTP functions in four runtimes, showing the common runtime settings:
# memory and CPU, concurrency, warm instances, timeouts, ingress, environment
# variables, Secret Manager secrets, who may invoke a function, and base-image
# update policies.
#
# defaults.functions is merged underneath every function, so each function
# only states what differs. Mappings merge (environment_variables below ends up
# with LOG_LEVEL plus the function's own variables); lists replace.
#
# region, source_bucket and project_id are template variables that main.tf
# fills in.

defaults:                               # settings for the whole file
  region: ${region}                     # region every function is deployed to
  labels:                               # labels on every function (billing, search)
    team: storefront
    cost-center: cc-1234
  functions:                            # starting values for every function below
    build_config:                       # how the code is built
      source:
        bucket: ${source_bucket}        # bucket the zipped code is uploaded to
        object_prefix: http-functions/  # zip names start with this prefix
      runtime_update_policy: AUTOMATIC  # base-image security patches without a redeploy
    service_config:                     # how the code runs
      # Identity the code runs as; its roles decide what the code may access.
      service_account_email: storefront-fns@${project_id}.iam.gserviceaccount.com
      max_instance_count: 10            # at most 10 instances of a function at once
      environment_variables:            # variables the code can read at run time
        LOG_LEVEL: info

functions:                              # one entry per function; the key is its name
  # Public, scales to zero.
  greeter:
    description: Public greeting endpoint.
    build_config:
      runtime: python312                # language and version
      entry_point: greet                # the function in the code to call
      source:
        dir: src/greeter-py             # folder that is zipped and uploaded
    service_config:
      available_memory: 256M            # memory per instance
      environment_variables:
        GREETING_LANGUAGE: de           # added to LOG_LEVEL from the defaults
    invokers: [allUsers]                # anyone may call it (public)

  # Authenticated API: two warm instances, one CPU serving 40 concurrent
  # requests each, and an API key from Secret Manager.
  orders-api:
    description: Order intake API (authenticated).
    labels:
      tier: critical                    # added to the default labels
    build_config:
      runtime: nodejs22
      entry_point: createOrder
      source:
        dir: src/orders-node
        excludes: [node_modules/**, "*.test.js"]   # files left out of the zip
    service_config:
      available_memory: 1Gi
      available_cpu: "1"                # CPUs per instance (written as a string)
      min_instance_count: 2             # always running: no cold starts, but billed while idle
      max_instance_count: 50            # overrides the default of 10
      max_instance_request_concurrency: 40   # requests one instance handles at the same time
      timeout_seconds: 30               # a request is stopped after 30 seconds
      secret_environment_variables:     # Secret Manager secrets, read as variables
        - key: ORDERS_API_KEY           # variable name the code reads
          secret: orders-api-key        # latest version, same project
    invokers:                           # only these may call it
      - serviceAccount:checkout@${project_id}.iam.gserviceaccount.com
      - group:storefront-devs@example.com

  # Internal only: reachable from the VPC and other Google Cloud services.
  pricing:
    description: Price quotes for internal callers.
    build_config:
      runtime: go123
      entry_point: Quote
      source:
        dir: src/pricing-go
      runtime_update_policy: ON_DEPLOY  # base-image patches only when you deploy
    service_config:
      available_memory: 512M
      ingress_settings: ALLOW_INTERNAL_ONLY   # no calls from the internet
      timeout_seconds: 10
    invokers:
      - serviceAccount:checkout@${project_id}.iam.gserviceaccount.com

  # Long-running report generation in Java; only the reporting group may call
  # it, and the platform team can view (not change) it.
  daily-report:
    description: Builds the daily orders report.
    build_config:
      runtime: java21
      entry_point: com.example.Reports  # for Java: the full class name
      source:
        dir: src/reports-java
        excludes: [target/**]           # local build output stays out of the zip
      environment_variables:            # used while building, not at run time
        GOOGLE_BUILDABLE: .             # build-time variable for the Java buildpack
    service_config:
      available_memory: 2Gi
      available_cpu: "2"
      timeout_seconds: 1800             # up to 30 minutes per request
      max_instance_count: 2
    invokers: [group:reporting@example.com]
    iam:                                # extra roles on the function itself
      - role: roles/cloudfunctions.viewer   # can see the function, not change it
        members: [group:platform-team@example.com]
