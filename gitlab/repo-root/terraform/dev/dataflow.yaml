# yaml-language-server: $schema=../../modules/dataflow/schemas/dataflow-config.schema.json
#
# Dataflow jobs and Data Pipelines of the DEV environment.
# Deployed by terraform/infra/dataflow.tf through modules/dataflow; this file
# is selected by dataflow_yaml_config_path in variables.tfvars.
#
# - jobs: streaming jobs. terraform apply launches them and they keep running.
#   A batch job would be launched again by every apply (the provider drops
#   finished jobs from the state), and the pipeline applies on every merge.
# - pipelines: recurring batch work. Cloud Scheduler launches a new job on
#   each schedule, independent of Terraform runs.
# - Each key is the job name or pipeline ID and part of its Terraform address,
#   so renaming a key replaces the job or pipeline.
# - The plan checks the whole file first, disabled entries included, and lists
#   every problem with its path, e.g. defaults.jobs: unknown key "machine".
# - Service accounts, buckets, subscriptions and tables named here must
#   already exist (sa.yaml, gcs.yaml, iam-bindings.yaml, bq.yaml).
# - The file is rendered with templatefile(): a literal dollar sign followed by
#   an opening brace must be written as $${ (see docs/configuration.md).
# - Every key, explained: modules/dataflow/docs/config-reference.yaml
#
# Every entry starts with enabled: false, so the file can be planned as it is.
# Replace every REPLACE-ME, then set enabled: true on the entries you want.

project_id: REPLACE-ME-dev-project-id   # the project every job and pipeline runs in

defaults:                           # settings every job and pipeline gets, unless it sets its own
  region: europe-west2              # where everything runs
  labels:                           # labels on every job, e.g. for cost reports
    environment: dev
    managed-by: terraform

  # Worker settings of every job and pipeline. &workers is merged into the
  # pipeline defaults below, so they are written once.
  jobs: &workers
    # The identity the workers run as.
    service_account_email: dataflow-worker@REPLACE-ME-dev-project-id.iam.gserviceaccount.com
    temp_location: gs://REPLACE-ME-dev-dataflow-bucket/tmp   # folder for temporary files
    # With Shared VPC, the full URL:
    # https://www.googleapis.com/compute/v1/projects/HOST_PROJECT/regions/europe-west2/subnetworks/NAME
    subnetwork: regions/europe-west2/subnetworks/REPLACE-ME-subnetwork   # the network the workers use
    ip_configuration: WORKER_IP_PRIVATE     # no public IPs; needs Private Google Access on the subnetwork
    machine_type: e2-standard-2             # size of each worker VM
    max_workers: 2                          # scale up to at most 2 workers (dev)

  pipelines:                        # settings shared by all pipelines
    <<: *workers                    # reuse the worker settings above
    # The identity Cloud Scheduler uses to start each scheduled run.
    scheduler_service_account_email: dataflow-scheduler@REPLACE-ME-dev-project-id.iam.gserviceaccount.com
    time_zone: Europe/London        # the schedules below are London time

jobs:                               # each key is one job, and its name
  # Streaming: Pub/Sub subscription to BigQuery, from a Google-provided Flex
  # Template. Runs until the entry is removed (or disabled).
  events-to-bigquery:
    enabled: false                  # checked, but not deployed; set to true to launch the job
    google_template:
      name: PubSub_to_BigQuery_Flex # Google's "Pub/Sub to BigQuery" template
    parameters:                     # the template's inputs
      # Read messages from this subscription.
      inputSubscription: projects/REPLACE-ME-dev-project-id/subscriptions/REPLACE-ME-subscription
      outputTableSpec: REPLACE-ME-dev-project-id:REPLACE-ME-dataset.events                    # write rows here
      outputDeadletterTable: REPLACE-ME-dev-project-id:REPLACE-ME-dataset.events_deadletter   # failed messages go here
    staging_location: gs://REPLACE-ME-dev-dataflow-bucket/staging   # folder for the job's staged files
    enable_streaming_engine: true   # keep streaming state in Dataflow's backend, not on the workers
    on_delete: cancel               # when removed, stop at once (dev: a destroy doesn't wait for a drain)

pipelines:                          # each key is one Data Pipeline, and its ID
  # Batch, daily at 02:00: newline-delimited JSON files to BigQuery, from a
  # Google-provided Flex Template.
  daily-files-to-bigquery:
    enabled: false                  # checked, but not deployed; set to true to create the pipeline
    schedule: "0 2 * * *"           # every day at 02:00
    google_template:
      name: GCS_Text_to_BigQuery_Flex   # Google's "files in Cloud Storage to BigQuery" template
    parameters:                     # the template's inputs
      inputFilePattern: gs://REPLACE-ME-dev-landing-bucket/daily/*.json               # the files to load
      JSONPath: gs://REPLACE-ME-dev-dataflow-bucket/schemas/daily.json                # the BigQuery schema of the rows
      outputTable: REPLACE-ME-dev-project-id:REPLACE-ME-dataset.daily                 # the table to load into
      bigQueryLoadingTemporaryDirectory: gs://REPLACE-ME-dev-dataflow-bucket/bq-tmp   # scratch space for the load

  # Batch, nightly at 01:30: your own Flex Template, i.e. the spec file that
  # gcloud dataflow flex-template build wrote. Created paused: state: ACTIVE
  # starts the schedule.
  nightly-orders-transform:
    enabled: false                  # checked, but not deployed; set to true to create the pipeline
    schedule: "30 1 * * *"          # every day at 01:30
    state: PAUSED                   # exists, but launches nothing until set to ACTIVE
    # Your Flex Template: the spec file in Cloud Storage.
    container_spec_gcs_path: gs://REPLACE-ME-dev-dataflow-bucket/templates/orders-transform.json
    parameters:                     # your pipeline's own inputs
      input_table: REPLACE-ME-dev-project-id:REPLACE-ME-dataset.orders
      output_table: REPLACE-ME-dev-project-id:REPLACE-ME-dataset.orders_curated
